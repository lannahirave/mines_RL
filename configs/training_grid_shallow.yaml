# Training configuration

env:
  grid_size: [15, 15]
  spawn_probs:
    apple: 0.50
    golden: 0.10
    poison: 0.15
    sour: 0.15
    rotten: 0.10
  max_objects: 5
  obstacle_decay: 50
  max_steps: 1000
  observation_type: "grid"
  starvation_max_steps: 400 # -1 disables starvation death
  proximity_good_scale: 0.01
  proximity_bad_scale: 0.001
  fruit_reward_length_coef: 0.5
  fruit_penalty_length_coef: 0.5
  fruit_penalty_min_factor: 0.25
  death_penalty_length_coef: 0.5
  death_penalty_min_scale: 0.35
  object_lifetime: 50 # steps before uneaten objects despawn (-1 = permanent)

agent:
  learning_rate: 0.0005
  discount_factor: 0.99
  epsilon_start: 0.99
  epsilon_end: 0.05
  epsilon_decay_steps: 500000
  buffer_size: 200000
  batch_size: 1024
  target_update_freq: 1000
  use_double_dqn: true
  use_dueling: true
  use_prioritized_replay: true
  lr_cosine_steps: 400000
  lr_min: 0.000001
  warmup_steps: 0 # min buffer size before training starts (0 = use batch_size)
  tau: 1 # target network interpolation (1.0 = hard copy, <1 = Polyak)
  sign_log_reward: false # sign(r)*log(1+|r|) reward scaling
  n_step: 3 # multi-step returns (1 = standard TD)
  n_frames: 1 # observation frame stacking (1 = no stacking)
  network_type: "grid_shallow" # "grid" (deep w/ res blocks) or "grid_shallow" (3 conv layers)

training:
  n_episodes: 20000
  eval_freq: 1000
  save_freq: 2000
  seed: 42

# GPU optimization settings
gpu:
  device: "cuda" # "auto", "cuda", "mps", or "cpu"
  use_amp: true # Automatic mixed precision (uses tensor cores)
  use_compile: true # torch.compile - enable for PyTorch 2.0+ (small overhead on first run)
  pin_memory: true # Pinned memory for async CPU→GPU transfers
  train_steps_per_update: 1 # Gradient steps per env step (increase to 2-4 for more GPU utilization)
