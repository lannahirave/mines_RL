# Training configuration

env:
  grid_size: [15, 15]
  spawn_probs:
    apple: 0.50
    golden: 0.10
    poison: 0.15
    sour: 0.15
    rotten: 0.10
  max_objects: 5
  obstacle_decay: 50
  max_steps: 1000
  observation_type: "features"

agent:
  learning_rate: 0.00005
  discount_factor: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 500000
  buffer_size: 200000
  batch_size: 256
  target_update_freq: 2000
  use_double_dqn: true
  use_dueling: true
  use_prioritized_replay: true

training:
  n_episodes: 20000
  eval_freq: 1500
  save_freq: 3000
  seed: 42

# GPU optimization settings
gpu:
  device: "auto"           # "auto", "cuda", "mps", or "cpu"
  use_amp: true            # Automatic mixed precision (uses tensor cores)
  use_compile: true        # torch.compile - enable for PyTorch 2.0+ (small overhead on first run)
  pin_memory: true         # Pinned memory for async CPU→GPU transfers
  train_steps_per_update: 1  # Gradient steps per env step (increase to 2-4 for more GPU utilization)
