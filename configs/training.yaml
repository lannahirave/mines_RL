# Training configuration

env:
  grid_size: [15, 15]
  spawn_probs:
    apple: 0.50
    golden: 0.10
    poison: 0.15
    sour: 0.15
    rotten: 0.10
  max_objects: 5
  obstacle_decay: 50
  max_steps: 1000
  observation_type: "features"
  starvation_max_steps: 400 # -1 disables starvation death
  proximity_good_scale: 0.01
  proximity_bad_scale: 0.001
  fruit_reward_length_coef: 0.5
  fruit_penalty_length_coef: 0.5
  fruit_penalty_min_factor: 0.25
  death_penalty_length_coef: 0.5
  death_penalty_min_scale: 0.35
  object_lifetime: 100 # steps before uneaten objects despawn (-1 = permanent)

agent:
  learning_rate: 0.0001
  discount_factor: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 250000   # reach epsilon_end ~60% through training (prev 500k was only 63% annealed → eps=0.40 at end, crippling train-time metrics)
  buffer_size: 300000
  batch_size: 1024             # fast GPU step (<0.5ms on 3080) without stalling CPU env loop
  target_update_freq: 2000
  use_double_dqn: true
  use_dueling: true
  use_prioritized_replay: true
  lr_cosine_steps: 700000       # matches realistic training-step budget (~1M with longer episodes)
  lr_min: 0.000001
  warmup_steps: 10000          # fill buffer before training; prevents noisy PER priorities early on
  tau: 1.0
  sign_log_reward: true        # log-scale rewards — stabilizes training across -500..+70 range
  n_step: 3                    # 3-step returns: faster credit assignment, more stable than 1-step
  n_frames: 1
  per_beta_frames: 400000       # anneal PER beta→1 in realistic horizon (prev 2M → never annealed)

training:
  n_episodes: 35000
  eval_freq: 1500
  save_freq: 3000
  seed: 42
  lookahead_depth: 0  # rollout depth for eval; 0 = disabled, >0 = min(snake_length, depth)
  weights: results/runs/20260410_101650/model_ep18000.pt  # checkpoint to load for eval

# GPU optimization settings
gpu:
  device: "auto" # "auto", "cuda", "mps", or "cpu"
  use_amp: true # Automatic mixed precision (uses tensor cores)
  use_compile: false # torch.compile - negligible benefit for small MLP; adds 30s warmup per run
  pin_memory: true # Pinned memory for async CPU->GPU transfers
  train_steps_per_update: 1 # gradient steps per training call
  train_freq: 3             # train every N env steps (reduces optimizer overhead; 3 = ~50 it/s)
